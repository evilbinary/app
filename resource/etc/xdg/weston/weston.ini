[core]
backend=fbdev-backend.so
use-pixman=true
idle-time=0
require-input=false
shell=desktop-shell.so

[shell]
client=/usr/libexec/weston-desktop-shell
background-color=0xff224466
panel-color=0xcc114477
background-type=tile
background-image=/usr/share/weston/background.png

# panel 就是 desktop-shell 那条横条，weston 上游没有独立的 dock 客户端：
# 把它挪到底部、加高一点、再配一组 [launcher]，就是 dock 的样子。
# launcher 图标按原尺寸居中绘制（panel_launcher_redraw_handler），所以图标
# 用 24x24 的 png，路径在 /usr/share/weston/（app/wayland/ya.py 构建期从
# eggs/weston/data 同步）。
panel-position=bottom
panel-size=32
locking=false
animation=none
close-animation=none

# ---- dock 图标（顺序即从左到右）----
# 每个 [launcher] 段 = 一个图标。desktop-shell 客户端
# （clients/desktop-shell.c 的 panel_add_launchers）按本文件里的先后顺序遍历
# 所有 [launcher] 段，支持的键：
#   icon=        图标 png 的绝对路径
#   path=        可执行文件绝对路径 —— 点击时 fork+execve()，【不能带参数】
#   displayname= 悬停提示，缺省是 path 的 basename
# 图标尺寸必须 <= panel-size(32)，否则在面板里上下溢出被裁：
#   · terminal.png / icon_flower.png / icon_window.png 上游本来就是 24x24
#     左右，直接用；
#   · fullscreen.png(96) / wayland.png(128) / icon_ivi_*.png(256) 太大，
#     已缩成 24x24 存成 dock_*.png（同目录，用 tools/gen_panel_icons.py 生成）。
# 【图标要和程序对得上】`icon_editor.png` 是 weston-editor 的图标，而 editor
# 依赖 pangocairo + gobject（本平台只有 cairo toy API，没编），所以它不放
# 图标位；clickdot 用自己的 icon_ivi_clickdot.png（缩成 dock_clickdot.png）。
# 上游没给专属图标的（scaler / constraints）用 dock_*.png 字母占位图。
# 只放"不需要参数就能独立跑"的客户端：weston-image 要文件名参数，
# weston-simple-{egl,dmabuf-*,vulkan} 依赖 EGL/GBM/Vulkan（本内核没有），
# weston-content_protection 需要 DRM 后端才注册 global，都不适合放这里。
[launcher]
icon=/usr/share/weston/terminal.png
path=/bin/weston-terminal
displayname=Terminal

[launcher]
icon=/usr/share/weston/dock_shm.png
path=/bin/wl-simple-shm
displayname=Simple SHM

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/bin/weston-flower
displayname=Flower

[launcher]
icon=/usr/share/weston/dock_clickdot.png
path=/bin/weston-clickdot
displayname=Clickdot

[launcher]
icon=/usr/share/weston/dock_editor.png
path=/bin/weston-clickdot
displayname=Editor

[launcher]
icon=/usr/share/weston/icon_window.png
path=/bin/weston-eventdemo
displayname=Event Demo

[launcher]
icon=/usr/share/weston/dock_fullscreen.png
path=/bin/weston-fullscreen
displayname=Fullscreen

[launcher]
icon=/usr/share/weston/dock_smoke.png
path=/bin/weston-smoke
displayname=Smoke

[launcher]
icon=/usr/share/weston/dock_stacking.png
path=/bin/weston-stacking
displayname=Stacking

[launcher]
icon=/usr/share/weston/dock_transformed.png
path=/bin/weston-transformed
displayname=Transformed

[launcher]
icon=/usr/share/weston/dock_resizor.png
path=/bin/weston-resizor
displayname=Resizor

[launcher]
icon=/usr/share/weston/dock_scaler.png
path=/bin/weston-scaler
displayname=Scaler

[launcher]
icon=/usr/share/weston/dock_constraints.png
path=/bin/weston-constraints
displayname=Constraints

[launcher]
icon=/usr/share/weston/dock_tablet.png
path=/bin/weston-tablet
displayname=Tablet

