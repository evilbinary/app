# 启动动画 /bin/logo。
#
# "wait " 前缀 = config 会给它一段"独占启动"时间（默认 2.5s）再启动下一行，
# 这样 /bin/ymain 不会在动画播完前就把画面盖掉。
#
# 【为什么 config 只延时、不 waitpid】本内核是在 waitpid 回收时才真正释放僵尸
# 线程的 vm/页（见 duck/kernel/thread.c 的注释）。若提前回收，紧接着 fork 的
# /bin/ymain 会复用刚释放的那批页 ⇒ miyoo 真机上 ymain 一起来就 PREF ABORT
# （pc 落在未映射地址；QEMU 不模拟 cache/TLB，所以看不出来）。所以 config 对
# "wait " 行只做墙钟延时、不做回收，回收交给文件读完后的 waitpid 循环。
#
# 延时用墙钟计时（xwin get_ticks, ms@1kHz）：miyoo 上 usleep/nanosleep 基本不睡。
#
# 网络调试/文件服务（远程 shell、上传）先起，方便板子无屏/掉屏时还能操作。
/bin/devd
# GPU 服务：V3D 初始化 + BO 分配。Mesa/EGL/GLES 客户端（weston gl-renderer、
# test-gles-*、test-gbm-egl）都通过 gpud 分配/提交，必须在它们之前常驻。
/bin/gpud
wait /bin/logo
# 风扇温控守护（raspi5：读 /dev/cpu 温度 -> 写 /dev/fan 档位，2 秒一档）。
# 其它平台没有这两个设备，进程只是每 2 秒空转一次，无副作用。
/bin/fand
