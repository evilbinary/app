# YiYiYa 系统配置文件
# ---------------------------------------------------------------------------
# 语法：# 开头为注释；[section] 分段；key = value
#       数值支持十进制，也支持 0x 前缀；行尾可以再跟 # 注释
# 生效时机：sysconf 模块的 init（注册在 fatfs 之后，此时 SD 卡已挂到 "/"）把文件读进
#          内存，然后回调各驱动登记的"配置就绪"函数 —— 取值和写硬件都在驱动自己那边。
#          见 duck/modules/sysconf/（只解析+提供取值）与驱动里的 apply 函数
#          （如 duck/modules/gpu/v3s.c 的 v3s_lcd_apply_conf）。
#          文件不存在 / 段不存在 / 键不存在 ⇒ 驱动保持内置默认值，不报错。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 显示（LCD / RGB 面板，DE+TCON 那条路，见 duck/modules/gpu/v3s.c）
#
# 面板参数必须成套，且与 u-boot 的 CONFIG_VIDEO_LCD_MODE 一致：
#   x→width  y→height  depth→bpp  pclk_khz→pclk_hz
#   le→hbp  ri→hfp  up→vbp  lo→vfp  hs→hspw  vs→vspw
#
# 【重要】下面两组参数**默认整组注释掉**：不写这些键 ⇒ 用驱动内置那组参数
#   （v3s 上实测能出图的那组，见 duck/modules/gpu/v3s.c 的 v3s_lcd_init）。
#   要用哪块屏，就把对应那组整组取消注释；不要只改其中一两项 ——
#   有效区 / 消隐 / 像素时钟 三者不一致时屏根本锁不住（现象：全黑或一直闪）。
# ---------------------------------------------------------------------------
[lcd]
# 【段名 = 谁来读】段名由驱动自己定：本段 [lcd] 是 v3s 那块 RGB 屏（DE+TCON）的参数，
#   由 duck/modules/gpu/v3s.c 的 v3s_lcd_apply_conf() 读取；别的显示驱动（SPI 小屏等）
#   用各自的段名各管各的 —— 不需要 device 键去找设备（sysconf 不认识任何显示设备）。
#
# 可用的键：width / height / bpp / pclk_hz / hbp / hfp / hspw / vbp / vfp / vspw /
#   clk_delay / test_color。**没写的键一律不动**（保持驱动内置默认）。
#
# clk_delay 可选：TCON0_CTRL[8:4] 像素时钟相位（0..31）。不写 = 沿用驱动默认
#   （老代码按消隐凑出的 (vfp+vbp+vspw)/2 = 22）。画面有噪点/雪花时按 1 步进扫它。
#
# —— A. 480x272 屏（LicheePi_Zero_480x272LCD_defconfig）
#width   = 480
#height  = 272
#bpp     = 18
#pclk_hz = 10000000
#hbp     = 42
#hfp     = 8
#hspw    = 1
#vbp     = 11
#vfp     = 4
#vspw    = 1
#clk_delay = 0
#
# —— B. 800x480 屏（LicheePi_Zero_800x480LCD_defconfig）
#   （bpp 可以省掉不写：不写就是驱动默认的 16，两种走不同的 FRM/dither 路）
#width   = 800
#height  = 480
#bpp     = 18
#pclk_hz = 33000000
#hbp     = 87
#hfp     = 40
#hspw    = 1
#vbp     = 31
#vfp     = 13
#vspw    = 1
#clk_delay = 22

# ---------------------------------------------------------------------------
# 点屏自检（可选，做面板 bring-up 时用，平时不写）
# 把整个帧缓冲填成该颜色。屏上出现纯色 ⇒ DE/TCON/面板/背光这条链是全通的，
# 之前的"黑屏"只是还没有任何应用往帧缓冲里画东西；仍然黑 ⇒ 时序/时钟/背光问题。
# 颜色建议用 0xFFFFFF 或 0xFFFFFFFF（任何像素格式下都是白）。
# ---------------------------------------------------------------------------
# test_color = 0xFFFFFF

# ---------------------------------------------------------------------------
# 设备节点绑定表（可选；多块屏 / 有的平台没 GPU、有的没 SPI 屏时用）
#
# 语法： <节点路径或裸名> = <设备名>
#   · 左边：fs 节点，写 /dev/xxx 或直接写 xxx（自动补 /dev/ 前缀）
#   · 右边：驱动注册 device_t 时的 name（gpu 注册 "vga"，SPI 屏注册 "lcd"；
#           多块同类屏请让驱动注册唯一名字 "vga"/"vga1"/"lcd1"…）
#   · 节点不存在会【现场创建】——所以"平台根本没有 /dev/fb（没 GPU）"也能用
#     fb = lcd 把它造出来并绑到 SPI 屏上
#   · 右边写 none 或 - ⇒ 解绑（读会返回 0，可用来屏蔽冲突设备）
#   · 设备名写错 ⇒ 只打一行 warn 并跳过，不会建出空节点
#
# 【不写本段会怎样】退回内置优先级：/dev/fb = GPU(RGB) > QEMU > SPI 屏 ——
#   也就是"谁在主显示位置"由内核默认决定，行为与以前一致。
# 【写了】配置说了算，与驱动注册顺序无关，并且启动日志里会有一行
#   devfs: /dev/fb -> vga  （谁绑了谁，一眼可见）
# 实现见 duck/modules/dev/devfs.c 的 devfs_bind_path()。
# ---------------------------------------------------------------------------
#[dev]
#fb     = vga          # 主显示/帧缓冲 = RGB 面板（有 GPU 的平台）
#lcd    = lcd          # SPI 小屏
#fb     = lcd          # ← 只有 SPI 屏、没有 GPU 的平台：把 /dev/fb 指给它
#fb1    = vga1         # 第二块屏（驱动注册成 "vga1" 时）
#mouse  = none         # 屏蔽：绑空
