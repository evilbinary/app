# YiYiYa 系统配置文件
# ---------------------------------------------------------------------------
# 语法：# 开头为注释；[section] 分段；key = value
#       数值支持十进制，也支持 0x 前缀；行尾可以再跟 # 注释
# 生效时机：sysconf 模块的 init（注册在 fatfs 之后，此时 SD 卡已挂到 "/"）
#          读取并统一下发给驱动，见 duck/modules/sysconf/sysconf.c。
#          文件不存在 / 段不存在 / 项为 0 ⇒ 驱动用内置默认值。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 显示（LCD / RGB 面板，DE+TCON 那条路，见 duck/modules/gpu/v3s.c）
#
# 面板参数必须成套，且与 u-boot 的 CONFIG_VIDEO_LCD_MODE 一致：
#   x→width  y→height  depth→bpp  pclk_khz→pclk_hz
#   le→hbp  ri→hfp  up→vbp  lo→vfp  hs→hspw  vs→vspw
#
# 荔枝派 Zero 480x272 屏（LicheePi_Zero_480x272LCD_defconfig）：
#   "x:480,y:272,depth:18,pclk_khz:10000,le:42,ri:8,up:11,lo:4,hs:1,vs:1"
# 同一块板子的 800x480 屏（LicheePi_Zero_800x480LCD_defconfig）：
#   "x:800,y:480,depth:18,pclk_khz:33000,le:87,ri:40,up:31,lo:13,hs:1,vs:1"
#   （换屏把下面这组值整组换掉，别只改一两项 —— 有效区/消隐/像素时钟三者
#     不一致时 panel 锁不住，现象就是"屏幕一直闪"。）
# ---------------------------------------------------------------------------
[lcd]
width   = 480
height  = 272
bpp     = 18
pclk_hz = 10000000
hbp     = 42
hfp     = 8
hspw    = 1
vbp     = 11
vfp     = 4
vspw    = 1
